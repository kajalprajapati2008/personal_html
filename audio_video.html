<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player </title>
</head>
 

<body>
    <h1>Multimedia Player</h1>

    <h3>Audio Player</h3>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <h3>Video Player</h3>
    <video width="350" height="180" controls>
        <source src="college.mp4" type="video/mp4">
    </video>
</body>
</html>
