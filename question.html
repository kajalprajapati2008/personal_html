<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<style>
    body{
        h1{
            text-align:center;
        }
        p{
            text-align:center;
        }

    }
</style>
<body>
    <h1>Student Registration Form</h1>
    <hr>

    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" required placeholder="enter your full name">
    <br></br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required placeholder="enter your email">
    <br></br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required placeholder="enter your password">
    <br></br>

    <label for="gender">Gender:</label>
     <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
     <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
     <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label>

    <br></br>
    <label for="course">Course:</label>
    <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="computer-science">Computer Science</option>
        <option value="mathematics">Mathematics</option>
        <option value="physics">Physics</option>
    </select>

    <br></br>

    <label for="contact">Contact Number:</label>
    <input type="tel" id="contact" name="contact" required placeholder="enter your contact number">

    <br> </br>
    <label for="address">Address:</label>
    <input type="text" id="address" name="address" required placeholder="enter your address">

    <br ></br>
    <input type="radio" value="register" name="form">register
      <input type="radio" value="clear" name="form">clear
      <hr>

      <p>2025 student registration portal</p>
    
</body>
</html>
